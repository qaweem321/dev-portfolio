name: Deploy to GitHub Pages

# One-time setup in your copy: Settings → Pages → Source: "GitHub Actions".
# Works for project sites (you.github.io/repo) and user sites (you.github.io).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  # A deploy that has started is allowed to finish (GitHub's own template does the same).
  cancel-in-progress: false

jobs:
  # Installs packages, checks and builds with read-only rights: a bad package's install script
  # can't publish anything.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6.0.0
      - run: npm ci
      # The same checks as CI, on the very files that get published: a push with type errors or
      # failing tests never goes live. The tests use a sample config, so editing yours can't break them.
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ASTRO_TELEMETRY_DISABLED: 1
      - run: npm test
        env:
          SITE_DIR: dist
          ASTRO_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  # Publishes the checked build. Only this job, which runs no project code, can deploy.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
