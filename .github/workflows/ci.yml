name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      # Unit tests, a build of the sample config, and general checks on the dist/ built above.
      - run: npm test
        env:
          SITE_DIR: dist
          ASTRO_TELEMETRY_DISABLED: 1
